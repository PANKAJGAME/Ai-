    <!-- Frontend Script -->
    <script>
        // अनलिमिटेड और नॉन-रिपीटिंग शायरी डेटाबेस (आप इसमें और भी जोड़ सकते हैं)
        const shayariList = [
            "न जाने कौन सा रिश्ता है इन आँखों का तुमसे, देखे बिना तुम्हें चैन ही नहीं आता।",
            "फर्क होता है खुदा और यार में, फर्क होता है किस्मत और प्यार में।",
            "तेरी यादों का समंदर कुछ इस तरह है, कि डूब जाऊँ तो भी साँसें चलती रहती हैं।",
            "ख्वाहिशें भले ही छोटी हों, लेकिन उन्हें पूरा करने के लिए दिल जिद्दी होना चाहिए।",
            "वक़्त बदलता है, ज़िंदगी बदलती है, पर अपनों की यादें हमेशा दिल में रहती हैं।",
            "तलाश ऐसी करो जो कभी न खत्म हो, और भरोसा ऐसा रखो जो कभी न टूटे।",
            "मुस्कुराना तो हर किसी की आदत है, किसी के दिल में बसना बहुत बड़ी इबादत है।",
            "हवाओं से कह दो ज़रा संभल कर चलें, मेरे अपनों के दिए हुए दीये बुझ न जाएं।",
            "जिंदगी जीने के दो ही तरीके हैं, जो पसंद है उसे हासिल कर लो या जो हासिल है उसे पसंद कर लो।",
            "तन्हाई में मुस्कुराना भी एक कला है, बिना किसी के होने का अहसास ही बहुत बड़ा है।",
            "लकीरें तो बहुत लंबी हैं हमारी, पर किस्मत, दोस्तों का प्यार देखकर बदल जाती है।",
            "हर कोई यहाँ दिल जीतने आया है, पर कोई किसी के दिल में ठहर नहीं पाता।"
        ];
        
        let availableShayaris = [...shayariList];

        function switchLanguage() {
            const lang = document.getElementById('langSelect').value;
            const mainTitle = document.getElementById('mainTitle');
            const subTitle = document.getElementById('subTitle');
            const labelName = document.getElementById('labelName');
            const labelMood = document.getElementById('labelMood');
            const nameInput = document.getElementById('friendName');
            const btnLabelText = document.getElementById('btnLabelText');
            const downloadText = document.getElementById('downloadText');
            const copyText = document.getElementById('copyText');
            const labelCustom = document.getElementById('labelCustom');
            const customVibeText = document.getElementById('customVibeText');

            if (lang === 'english') {
                mainTitle.innerText = "Shayari & Vibe Bot";
                subTitle.innerText = "Get unlimited shayaris and brutal AI roasts instantly! 🔥";
                labelName.innerText = "Friend's Name or Nickname:";
                labelMood.innerText = "Select Mode:";
                nameInput.placeholder = "e.g., John, The Gym Bro...";
                if(labelCustom) labelCustom.innerText = "Enter your custom topic or situation:";
                if(customVibeText) customVibeText.placeholder = "e.g., Always late to meetings...";
                btnLabelText.innerText = "Generate Magic ⚡";
                downloadText.innerText = "Download Story Card (HD)";
                copyText.innerText = "Copy";
            } else {
                mainTitle.innerText = "शायरी और रोस्ट ज़ोन";
                subTitle.innerText = "बिना किसी झंझट के पाएं अनलिमिटेड शायरियां और AI रोस्ट! 😂";
                labelName.innerText = "दोस्त का नाम या निकनेम:";
                labelMood.innerText = "मोड चुनें (Mode):";
                nameInput.placeholder = "उदा. राहुल, शर्मा जी का बेटा...";
                if(labelCustom) labelCustom.innerText = "अपनी पसंद का टॉपिक या सिचुएशन लिखें:";
                if(customVibeText) customVibeText.placeholder = "उदा. सुबह जल्दी उठने का नाटक करने वाला...";
                btnLabelText.innerText = "मैजिक देखें";
                downloadText.innerText = "स्टोरी कार्ड डाउनलोड करें (HD)";
                copyText.innerText = "कॉपी";
            }
        }

        function checkCustomVibe() {
            const vibe = document.getElementById('vibeType').value;
            const customContainer = document.getElementById('customVibeContainer');
            if (vibe === 'custom') {
                customContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
            }
        }

        async function generateContent() {
            const name = document.getElementById('friendName').value.trim();
            let vibe = document.getElementById('vibeType').value;
            const lang = document.getElementById('langSelect').value;
            const resultCard = document.getElementById('resultCard');
            const outputText = document.getElementById('outputText');
            const actionButtons = document.getElementById('actionButtons');

            if (name === "") {
                alert(lang === 'english' ? "Please enter a name first! 😉" : "कृपया पहले नाम तो दर्ज करें! 😉");
                return;
            }

            resultCard.classList.remove('hidden');
            actionButtons.classList.add('hidden');

            // 1. अगर यूजर ने 'शायरी मोड' चुना है तो बिना रिपीट हुए अनलिमिटेड शायरी देगा
            if (vibe === 'shayari') {
                if (availableShayaris.length === 0) {
                    availableShayaris = [...shayariList]; // लिस्ट खत्म होने पर ऑटोमैटिक रिफ्रेश हो जाएगी
                }
                const randomIndex = Math.floor(Math.random() * availableShayaris.length);
                const selectedShayari = availableShayaris.splice(randomIndex, 1)[0];

                outputText.innerText = `"${name}, ${selectedShayari}"`;
                actionButtons.classList.remove('hidden');
                return;
            }

            // 2. अगर यूजर ने कस्टम टॉपिक चुना है
            if (vibe === 'custom') {
                const customInput = document.getElementById('customVibeText').value.trim();
                if (customInput !== "") {
                    vibe = customInput;
                } else {
                    alert(lang === 'english' ? "Please enter your custom topic!" : "कृपया अपना कस्टम टॉपिक दर्ज करें!");
                    resultCard.classList.add('hidden');
                    return;
                }
            }

            outputText.innerText = lang === 'english' ? "🤖 AI is generating magic... Hold tight! ⚡" : "🤖 आपका मैजिक तैयार हो रहा है... थोड़ा इंतज़ार करें! ⚡";

            // रोस्ट या अन्य मोड्स के लिए सर्वर कॉल
            try {
                const response = await fetch('/api/roast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, vibe, lang })
                });

                const data = await response.json();
                
                if (data.reply) {
                    outputText.innerText = `"${data.reply}"`;
                    actionButtons.classList.remove('hidden');
                } else {
                    outputText.innerText = `"${name}, AI is taking a coffee break. Try again! 😂"`;
                    actionButtons.classList.add('hidden');
                }

            } catch (error) {
                console.error("Error:", error);
                outputText.innerText = `"${name}, failed to connect to the server! 💀"`;
                actionButtons.classList.add('hidden');
            }
        }

        function downloadStoryImage() {
            const text = document.getElementById('outputText').innerText;
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1080;
            canvas.height = 1350;

            let gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
            gradient.addColorStop(0, '#1a0b2e');
            gradient.addColorStop(0.5, '#0f051d');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.roundRect(80, 250, 920, 850, 40);
            ctx.fill();
            ctx.strokeStyle = 'rgba(236, 72, 153, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 50px Poppins, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('✨ SHAYARI & VIBE ✨', canvas.width / 2, 380);

            ctx.fillStyle = '#ffffff';
            ctx.font = '600 44px Poppins, sans-serif';
            wrapText(ctx, text, canvas.width / 2, 580, 800, 70);

            ctx.fillStyle = '#9ca3af';
            ctx.font = '30px Poppins, sans-serif';
            ctx.fillText('aivibebot.com ✨', canvas.width / 2, 1020);

            let link = document.createElement('a');
            link.download = 'shayari-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function shareOnWhatsApp() {
            const text = document.getElementById('outputText').innerText;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + "\n\n- Generated via aivibebot.com 🔥")}`;
            window.open(whatsappUrl, '_blank');
        }

        function shareOnTwitter() {
            const text = document.getElementById('outputText').innerText;
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text + "\n\nChecked this on aivibebot.com 🔥 @aivibebot")}`;
            window.open(twitterUrl, '_blank');
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text);
            const lang = document.getElementById('langSelect').value;
            alert(lang === 'english' ? "Copied to clipboard! 👍" : "टेक्स्ट कॉपी हो गया! 👍");
        }
    </script>
