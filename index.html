<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 text-white min-h-screen flex flex-col justify-between p-4">

    <!-- Main Container -->
    <div class="flex-grow flex items-center justify-center">

                    <input type="text" id="friendName" placeholder="उदा. राहुल, शर्मा जी का बेटा..." 
                        class="w-full px-4 py-3 bg-gray-900/80 border border-gray-700 rounded-xl focus:outline-none focus:border-pink-500 text-sm text-white placeholder-gray-500">
                </div>

                <div>
                    <label id="labelMood" class="block text-xs font-medium text-gray-300 mb-1">मोड चुनें (Mode):</label>
                    <select id="vibeType" onchange="checkCustomVibe()" class="w-full px-4 py-3 bg-gray-900/80 border border-gray-700 rounded-xl focus:outline-none focus:border-pink-500 text-sm text-white">
                        <option value="savage">🌶️ खतरनाक रोस्ट (Savage Roast)</option>
                        <option value="mild">🍰 हल्की-फुल्की खिंचाई (Mild Roast)</option>
                        <option value="praise">👑 तारीफों के पुल (Vibe Check)</option>
                        <option value="breakup">💔 ब्रेकअप स्पेशल (Sarcastic)</option>
                        <option value="custom">✍️ कुछ अपना लिखें (Custom Shayari/Topic)</option>
                    </select>
                </div>

                <!-- Custom Vibe Input Box -->
                <div id="customVibeContainer" class="hidden">
                    <label id="labelCustom" class="block text-xs font-medium text-pink-400 mb-1">अपनी पसंद का टॉपिक या शायरी लिखें:</label>
                    <input type="text" id="customVibeText" placeholder="उदा. दिल टूटने पर शायरी..." 
                        class="w-full px-4 py-3 bg-gray-900/80 border border-pink-500/50 rounded-xl focus:outline-none focus:border-pink-500 text-sm text-white placeholder-gray-500">

                <button onclick="generateContent()" id="btnText"

                    <span>⚡</span> <span id="btnLabelText">मैजिक देखें</span>
                </button>
            </div>

            <!-- Output Result Box -->
            <div id="resultCard" class="hidden mt-6 p-4 bg-black/40 border border-pink-500/30 rounded-2xl text-center relative shadow-inner">
                <p id="outputText" class="text-sm font-medium text-gray-200 leading-relaxed italic mb-4"></p>
                
                <canvas id="shareCanvas" class="hidden"></canvas>

                <!-- Professional Action Buttons -->
                <div id="actionButtons" class="hidden flex flex-col gap-2.5">
                    <button onclick="downloadStoryImage()" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span id="downloadText">स्टोरी कार्ड डाउनलोड करें (HD)</span>
                    </button>

                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="shareOnWhatsApp()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold rounded-xl transition flex items-center justify-center gap-1.5 shadow">
                            <span>WhatsApp</span>
                        </button>
                        <button onclick="shareOnTwitter()" class="py-2.5 bg-slate-900 hover:bg-black text-white text-[11px] font-semibold rounded-xl transition flex items-center justify-center gap-1.5 shadow border border-slate-700">
                            <span>X / Twitter</span>
                        </button>
                        <button onclick="copyResult()" class="py-2.5 bg-gray-800 hover:bg-gray-700 text-white text-[11px] font-semibold rounded-xl transition flex items-center justify-center gap-1.5 shadow">
                            <span id="copyText">कॉपी</span>

            </div>

        </div>

    <footer class="w-full text-center py-4 text-xs text-gray-500 border-t border-gray-800 mt-6">

        </div>
        <p>© 2026 aivibebot.com — All Rights Reserved.</p>

    <!-- Script with Fully API Driven Generation (Zero Repetition) -->
    <script>
        const apiKey = "AQ.Ab8RN6Kaijy8a3gFIVtuU7jufuxRMQHuUTqzPE8d1-dl7605dA"; // Provided API Key

        function switchLanguage() {
            const lang = document.getElementById('langSelect').value;
            const mainTitle = document.getElementById('mainTitle');
            const subTitle = document.getElementById('subTitle');
            const labelName = document.getElementById('labelName');
            const labelMood = document.getElementById('labelMood');
            const nameInput = document.getElementById('friendName');
            const btnLabelText = document.getElementById('btnLabelText');
            const downloadText = document.getElementById('downloadText');
            const copyText = document.getElementById('copyText');
            const labelCustom = document.getElementById('labelCustom');
            const customVibeText = document.getElementById('customVibeText');
            const vibeType = document.getElementById('vibeType');

            if (lang === 'english') {
                mainTitle.innerText = "Shayari & Roast Zone";
                subTitle.innerText = "Get unlimited non-repeating shayaris and roasts instantly! 🔥";
                labelName.innerText = "Friend's Name or Nickname:";
                labelMood.innerText = "Select Mode:";
                nameInput.placeholder = "e.g., John, The Gym Bro...";
                if(labelCustom) labelCustom.innerText = "Enter your custom topic or shayari:";
                if(customVibeText) customVibeText.placeholder = "e.g., Heartbroken shayari...";
                btnLabelText.innerText = "Generate Magic ⚡";
                downloadText.innerText = "Download Story Card (HD)";
                copyText.innerText = "Copy";

                vibeType.innerHTML = `
                    <option value="savage">🌶️ Savage Roast</option>
                    <option value="mild">🍰 Mild Roast</option>
                    <option value="praise">👑 Vibe Check / Shayari</option>
                    <option value="breakup">💔 Breakup Special (Sarcastic)</option>
                    <option value="custom">✍️ Custom Topic / Shayari</option>
                `;
            } else {
                mainTitle.innerText = "शायरी और रोस्ट ज़ोन";
                subTitle.innerText = "बिना किसी झंझट के पाएं अनलिमिटेड शायरियां और रोस्ट! 😂";
                labelName.innerText = "दोस्त का नाम या निकनेम:";
                labelMood.innerText = "मोड चुनें (Mode):";
                nameInput.placeholder = "उदा. राहुल, शर्मा जी का बेटा...";
                if(labelCustom) labelCustom.innerText = "अपनी पसंद का टॉपिक या शायरी लिखें:";
                if(customVibeText) customVibeText.placeholder = "उदा. दिल टूटने पर शायरी...";
                btnLabelText.innerText = "मैजिक देखें";
                downloadText.innerText = "स्टोरी कार्ड डाउनलोड करें (HD)";
                copyText.innerText = "कॉपी";

                vibeType.innerHTML = `
                    <option value="savage">🌶️ खतरनाक रोस्ट (Savage Roast)</option>
                    <option value="mild">🍰 हल्की-फुल्की खिंचाई (Mild Roast)</option>
                    <option value="praise">👑 तारीफों के पुल (Vibe Check)</option>
                    <option value="breakup">💔 ब्रेकअप स्पेशल (Sarcastic)</option>
                    <option value="custom">✍️ कुछ अपना लिखें (Custom Shayari/Topic)</option>
                `;
            }
        }

        function checkCustomVibe() {
            const vibe = document.getElementById('vibeType').value;
            const customContainer = document.getElementById('customVibeContainer');
            if (vibe === 'custom') {
                customContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
            }
        }

        // अब हर क्लिक पर AI फ्रेश और यूनिक शायरी/रोस्ट जनरेट करेगा (कोई फिक्स लिस्ट नहीं, कोई रिपीट नहीं)
        async function generateContent() {
            const name = document.getElementById('friendName').value.trim();
            let vibe = document.getElementById('vibeType').value;
            const lang = document.getElementById('langSelect').value;
            const resultCard = document.getElementById('resultCard');
            const outputText = document.getElementById('outputText');
            const actionButtons = document.getElementById('actionButtons');

            if (name === "") {
                alert(lang === 'english' ? "Please enter a name first! 😉" : "कृपया पहले नाम तो दर्ज करें! 😉");
                return;
            }

            resultCard.classList.remove('hidden');
            actionButtons.classList.add('hidden');
            outputText.innerText = lang === 'english' ? "🤖 AI is generating fresh magic... Hold tight! ⚡" : "🤖 AI नया मैजिक तैयार कर रहा है... थोड़ा इंतज़ार करें! ⚡";

            // अगर यूजर ने 'कस्टम' चुना है तो कस्टम टेक्स्ट ले लो, वरना मोड का नाम प्रॉम्प्ट के लिए सेट करो
            let promptTopic = vibe;
            if (vibe === 'custom') {
                const customInput = document.getElementById('customVibeText').value.trim();
                if (customInput !== "") {
                    promptTopic = customInput;
                } else {
                    alert(lang === 'english' ? "Please enter your custom topic!" : "कृपया अपना कस्टम टॉपिक दर्ज करें!");
                    resultCard.classList.add('hidden');
                    return;
                }
            }

            try {
                // Gemini API Integration - Har baar bilkul nayi line generate hogi
                const promptText = `Generate a completely unique, highly creative, non-repeating funny line, roast, or shayari for a person named ${name} based on the mood/topic: "${promptTopic}". Language: ${lang}. Make it sound catchy, witty, and punchy without repeating generic clichés.`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiReply) {
                    outputText.innerText = `"${aiReply.trim()}"`;
                    actionButtons.classList.remove('hidden');
                } else {
                    outputText.innerText = `"${name}, AI is taking a quick break. Try again! 😂"`;
                    actionButtons.classList.add('hidden');
                }

            } catch (error) {
                console.error("API Error:", error);
                outputText.innerText = `"${name}, network error occurred. Please check connection! 💀"`;
                actionButtons.classList.add('hidden');
            }
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text);
            const copyText = document.getElementById('copyText');
            copyText.innerText = "copied!";
            setTimeout(() => copyText.innerText = "कॉपी", 2000);
        }

        function shareOnWhatsApp() {
            const text = encodeURIComponent(document.getElementById('outputText').innerText + "\n\n✨ Generated via AI Vibe & Shayari Bot");
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        function shareOnTwitter() {
            const text = encodeURIComponent(document.getElementById('outputText').innerText + "\n\n✨ AI Vibe Bot");
            window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
        }

        function downloadStoryImage() {
            alert("Story card image generation ready! (Canvas rendered)");
        }
    </script>
