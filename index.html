    <!-- Gemini AI Integration Script -->
    <script>
        // नई API Key यहाँ अपडेट कर दी गई है!
        const GEMINI_API_KEY = "AQ.Ab8RN6JvqlataFHgEkwmZ0T01-TM_flga7_J44m40vqpEH9fqw";

        function switchLanguage() {
            const lang = document.getElementById('langSelect').value;
            const mainTitle = document.getElementById('mainTitle');
            const subTitle = document.getElementById('subTitle');
            const labelName = document.getElementById('labelName');
            const labelMood = document.getElementById('labelMood');
            const nameInput = document.getElementById('friendName');
            const btnLabelText = document.getElementById('btnLabelText');
            const downloadText = document.getElementById('downloadText');
            const copyText = document.getElementById('copyText');
            const labelCustom = document.getElementById('labelCustom');
            const customVibeText = document.getElementById('customVibeText');

            if (lang === 'english') {
                mainTitle.innerText = "Global AI Vibe Bot";
                subTitle.innerText = "Get infinite 100% unique AI roasts instantly! 🔥";
                labelName.innerText = "Friend's Name or Nickname:";
                labelMood.innerText = "Select Vibe / Mood:";
                nameInput.placeholder = "e.g., John, The Gym Bro...";
                if(labelCustom) labelCustom.innerText = "Enter your custom topic or situation:";
                if(customVibeText) customVibeText.placeholder = "e.g., Always late to meetings...";
                btnLabelText.innerText = "Generate AI Vibe ⚡";
                downloadText.innerText = "Download Story Card (HD)";
                copyText.innerText = "Copy";
            } else {
                mainTitle.innerText = "Desi Roast & Vibe";
                subTitle.innerText = "हर बार बिल्कुल नई और अनलिमिटेड AI शायरी! 😂";
                labelName.innerText = "दोस्त का नाम या निकनेम:";
                labelMood.innerText = "मूड चुनें (Mood):";
                nameInput.placeholder = "उदा. राहुल, शर्मा जी का बेटा...";
                if(labelCustom) labelCustom.innerText = "अपनी पसंद का टॉपिक या सिचुएशन लिखें:";
                if(customVibeText) customVibeText.placeholder = "उदा. सुबह जल्दी उठने का नाटक करने वाला...";
                btnLabelText.innerText = "AI मैजिक देखें";
                downloadText.innerText = "स्टोरी कार्ड डाउनलोड करें (HD)";
                copyText.innerText = "कॉपी";
            }
        }

        function checkCustomVibe() {
            const vibe = document.getElementById('vibeType').value;
            const customContainer = document.getElementById('customVibeContainer');
            if (vibe === 'custom') {
                customContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
            }
        }

        async function generateAI_Roast() {
            const name = document.getElementById('friendName').value.trim();
            const vibe = document.getElementById('vibeType').value;
            const lang = document.getElementById('langSelect').value;
            const resultCard = document.getElementById('resultCard');
            const outputText = document.getElementById('outputText');
            const actionButtons = document.getElementById('actionButtons');

            if (name === "") {
                alert(lang === 'english' ? "Please enter a name first! 😉" : "कृपया पहले दोस्त का नाम तो दर्ज करें! 😉");
                return;
            }

            resultCard.classList.remove('hidden');
            actionButtons.classList.add('hidden');
            outputText.innerText = lang === 'english' ? "🤖 Gemini AI is crafting a unique roast... ⚡" : "🤖 Gemini AI आपके लिए बिल्कुल नई शायरी बना रहा है... ⚡";

            let promptText = "";
            let customTopic = document.getElementById('customVibeText').value.trim();

            if (vibe === 'custom' && customTopic === "") {
                alert(lang === 'english' ? "Please enter your custom vibe text!" : "कृपया अपना कस्टम वाइब टेक्स्ट दर्ज करें!");
                resultCard.classList.add('hidden');
                return;
            }

            if (lang === 'hinglish') {
                if (vibe === 'savage') promptText = `Write a very funny, savage desi roast in Hinglish for a friend named '${name}'. Make it witty with emojis, max 2 lines.`;
                else if (vibe === 'mild') promptText = `Write a cute and funny mild tease in Hinglish for a friend named '${name}' with emojis, max 2 lines.`;
                else if (vibe === 'praise') promptText = `Write an enthusiastic, funny praise/vibe check in Hinglish for a friend named '${name}' with emojis, max 2 lines.`;
                else if (vibe === 'breakup') promptText = `Write a sarcastic breakup/single life joke in Hinglish for a friend named '${name}' with emojis, max 2 lines.`;
                else if (vibe === 'custom') promptText = `Write a funny creative roast/shayari in Hinglish for a friend named '${name}' based on this topic: '${customTopic}' with emojis, max 2 lines.`;
            } else {
                if (vibe === 'savage') promptText = `Write a very funny, savage roast in English for a friend named '${name}'. Add emojis, max 2 lines.`;
                else if (vibe === 'mild') promptText = `Write a cute and funny mild tease in English for a friend named '${name}'. Add emojis, max 2 lines.`;
                else if (vibe === 'praise') promptText = `Write an energetic, funny praise/vibe check in English for a friend named '${name}'. Add emojis, max 2 lines.`;
                else if (vibe === 'breakup') promptText = `Write a sarcastic single life joke in English for a friend named '${name}'. Add emojis, max 2 lines.`;
                else if (vibe === 'custom') promptText = `Write a funny creative roast in English for a friend named '${name}' based on this topic: '${customTopic}'. Add emojis, max 2 lines.`;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    let aiReply = data.candidates[0].content.parts[0].text.trim();
                    outputText.innerText = `"${aiReply}"`;
                    actionButtons.classList.remove('hidden');
                } else {
                    throw new Error("Invalid API response format");
                }
            } catch (error) {
                console.error(error);
                outputText.innerText = lang === 'english' ? "Oops! Something went wrong. Try again!" : "उफ़! कुछ गड़बड़ हो गई। दोबारा कोशिश करें!";
                actionButtons.classList.remove('hidden');
            }
        }

        function downloadStoryImage() {
            const text = document.getElementById('outputText').innerText;
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1080;
            canvas.height = 1350;

            let gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
            gradient.addColorStop(0, '#1a0b2e');
            gradient.addColorStop(0.5, '#0f051d');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.roundRect(80, 250, 920, 850, 40);
            ctx.fill();
            ctx.strokeStyle = 'rgba(236, 72, 153, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 50px Poppins, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🔥 AI VIBE CHECK 🔥', canvas.width / 2, 380);

            ctx.fillStyle = '#ffffff';
            ctx.font = '600 44px Poppins, sans-serif';
            wrapText(ctx, text, canvas.width / 2, 580, 800, 70);

            ctx.fillStyle = '#9ca3af';
            ctx.font = '30px Poppins, sans-serif';
            ctx.fillText('aivibebot.com ✨', canvas.width / 2, 1020);

            let link = document.createElement('a');
            link.download = 'vibe-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function shareOnWhatsApp() {
            const text = document.getElementById('outputText').innerText;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + "\n\n- Generated via aivibebot.com 🔥")}`;
            window.open(whatsappUrl, '_blank');
        }

        function shareOnTwitter() {
            const text = document.getElementById('outputText').innerText;
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text + "\n\nChecked my vibe on aivibebot.com 🔥 @aivibebot")}`;
            window.open(twitterUrl, '_blank');
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text);
            const lang = document.getElementById('langSelect').value;
            alert(lang === 'english' ? "Copied to clipboard! 👍" : "टेक्स्ट कॉपी हो गया! 👍");
        }
    </script>
