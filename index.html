        function switchLanguage() {
            const lang = document.getElementById('langSelect').value;

                nameInput.placeholder = "उदा. राहुल, शर्मा जी का बेटा...";
                if(labelCustom) labelCustom.innerText = "अपनी पसंद का टॉपिक या शायरी लिखें:";

                downloadText.innerText = "स्टोरी कार्ड डाउनलोड करें (HD)";

                vibeType.innerHTML = `
                    <option value="savage">🌶️ खतरनाक रोस्ट (Savage Roast)</option>
                    <option value="mild">🍰 हल्की-फुल्की खिंचाई (Mild Roast)</option>

                    <option value="breakup">💔 ब्रेकअप स्पेशल (Sarcastic)</option>

        function checkCustomVibe() {
            const vibe = document.getElementById('vibeType').value;
            const customContainer = document.getElementById('customVibeContainer');
            if (vibe === 'custom') {
                customContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
            }
        }

        async function generateContent() {
            const name = document.getElementById('friendName').value.trim();
            let vibe = document.getElementById('vibeType').value;
            const lang = document.getElementById('langSelect').value;
            const resultCard = document.getElementById('resultCard');
            const outputText = document.getElementById('outputText');
            const actionButtons = document.getElementById('actionButtons');

            if (name === "") {
                alert(lang === 'english' ? "Please enter a name first! 😉" : "कृपया पहले नाम तो दर्ज करें! 😉");
                return;
            }

            resultCard.classList.remove('hidden');
            actionButtons.classList.add('hidden');

            // 4 मुख्य मोड्स के लिए अनलिमिटेड नॉन-रिपीटिंग लोकल डेटा से रैंडम पिक करेगा
            if (vibe !== 'custom') {
                if (!usedItemsTracker[vibe]) {
                    usedItemsTracker[vibe] = [];
                }

                if (usedItemsTracker[vibe].length >= unlimitedDatabase[vibe].length) {
                    usedItemsTracker[vibe] = []; // सारे खत्म होने पर ऑटोमैटिक रिफ्रेश
                }

                let availableIndexes = [];
                for (let i = 0; i < unlimitedDatabase[vibe].length; i++) {
                    if (!usedItemsTracker[vibe].includes(i)) {
                        availableIndexes.push(i);
                    }
                }

                let randomIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
                usedItemsTracker[vibe].push(randomIndex);
                let selectedLine = unlimitedDatabase[vibe][randomIndex];

                outputText.innerText = `"${name}, ${selectedLine}"`;
                actionButtons.classList.remove('hidden');
                return;
            }

            // अगर यूजर ने 'कस्टम टॉपिक' चुना है, तो बैकएंड एपीआई कॉल करेगा
            if (vibe === 'custom') {
                const customInput = document.getElementById('customVibeText').value.trim();
                if (customInput !== "") {
                    vibe = customInput;
                } else {
                    alert(lang === 'english' ? "Please enter your custom topic!" : "कृपया अपना कस्टम टॉपिक दर्ज करें!");
                    resultCard.classList.add('hidden');
                    return;
                }
            }

            outputText.innerText = lang === 'english' ? "🤖 AI is generating magic... Hold tight! ⚡" : "🤖 आपका मैजिक तैयार हो रहा है... थोड़ा इंतज़ार करें! ⚡";

            try {
                const response = await fetch('/api/roast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, vibe, lang })
                });

                const data = await response.json();
                
                if (data.reply) {
                    outputText.innerText = `"${data.reply}"`;
                    actionButtons.classList.remove('hidden');
                } else {
                    outputText.innerText = `"${name}, AI is taking a coffee break. Try again! 😂"`;
                    actionButtons.classList.add('hidden');
                }

            } catch (error) {
                console.error("Error:", error);
                outputText.innerText = `"${name}, failed to connect to the server! 💀"`;
                actionButtons.classList.add('hidden');
            }
        }

        function downloadStoryImage() {
            const text = document.getElementById('outputText').innerText;
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1080;
            canvas.height = 1350;

            let gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
            gradient.addColorStop(0, '#1a0b2e');
            gradient.addColorStop(0.5, '#0f051d');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.roundRect(80, 250, 920, 850, 40);
            ctx.fill();
            ctx.strokeStyle = 'rgba(236, 72, 153, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 50px Poppins, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('✨ SHAYARI & VIBE ZONE ✨', canvas.width / 2, 380);

            ctx.fillStyle = '#ffffff';
            ctx.font = '600 44px Poppins, sans-serif';
            wrapText(ctx, text, canvas.width / 2, 580, 800, 70);

            ctx.fillStyle = '#9ca3af';
            ctx.font = '30px Poppins, sans-serif';
            ctx.fillText('aivibebot.com ✨', canvas.width / 2, 1020);

            let link = document.createElement('a');
            link.download = 'shayari-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function shareOnWhatsApp() {
            const text = document.getElementById('outputText').innerText;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + "\n\n- Generated via aivibebot.com 🔥")}`;
            window.open(whatsappUrl, '_blank');
        }

        function shareOnTwitter() {
            const text = document.getElementById('outputText').innerText;
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text + "\n\nChecked this on aivibebot.com 🔥 @aivibebot")}`;
            window.open(twitterUrl, '_blank');
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text);
            const lang = document.getElementById('langSelect').value;
            alert(lang === 'english' ? "Copied to clipboard! 👍" : "टेक्स्ट कॉपी हो गया! 👍");
        }
    </script>
