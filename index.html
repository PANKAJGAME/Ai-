        function generateRoast() {

            let vibe = document.getElementById('vibeType').value;
            const lang = document.getElementById('langSelect').value;
            const resultCard = document.getElementById('resultCard');
            const outputText = document.getElementById('outputText');
            const actionButtons = document.getElementById('actionButtons');

            if (name === "") {
                alert(lang === 'english' ? "Please enter a name first! 😉" : "कृपया पहले दोस्त का नाम तो दर्ज करें! 😉");
                return;
            }

            resultCard.classList.remove('hidden');
            actionButtons.classList.add('hidden');
            outputText.innerText = lang === 'english' ? "🤖 Smart Vibe is cooking up a fresh line... Hold tight! ⚡" : "🤖 आपका नया रोस्ट तैयार हो रहा है... थोड़ा इंतज़ार करें! ⚡";

            setTimeout(() => {
                let pool;
                if (vibe === 'custom') {
                    const customInput = document.getElementById('customVibeText').value.trim();
                    if (customInput === "") {
                        alert(lang === 'english' ? "Please enter your custom vibe text!" : "कृपया अपना कस्टम वाइब टेक्स्ट दर्ज करें!");
                        resultCard.classList.add('hidden');
                        return;
                    }
                    if (lang === 'english') {
                        outputText.innerText = `"${name}, regarding your topic '${customInput}': Absolutely legendary chaos happening right here! 💀🔥"`;
                    } else {
                        outputText.innerText = `"${name}, आपके इस खास टॉपिक '${customInput}' पर तो भाई इतिहास लिखा जाना चाहिए! 😂🔥"`;
                    }
                    actionButtons.classList.remove('hidden');
                    return;
                }

                // Standard Mood Pools
                const langPool = questionPools[lang] || questionPools['hinglish'];
                pool = langPool[vibe] || langPool['savage'];

                // Random selection ensuring dynamic feel
                const randomIndex = Math.floor(Math.random() * pool.length);
                let selectedTemplate = pool[randomIndex];
                let finalReply = selectedTemplate.replace(/{name}/g, name);

                outputText.innerText = `"${finalReply}"`;
                actionButtons.classList.remove('hidden');
            }, 600);
        }

        function downloadStoryImage() {
            const text = document.getElementById('outputText').innerText;
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1080;
            canvas.height = 1350;

            let gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
            gradient.addColorStop(0, '#1a0b2e');
            gradient.addColorStop(0.5, '#0f051d');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.roundRect(80, 250, 920, 850, 40);
            ctx.fill();
            ctx.strokeStyle = 'rgba(236, 72, 153, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 50px Poppins, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🔥 SMART VIBE CHECK 🔥', canvas.width / 2, 380);

            ctx.fillStyle = '#ffffff';
            ctx.font = '600 44px Poppins, sans-serif';
            wrapText(ctx, text, canvas.width / 2, 580, 800, 70);

            ctx.fillStyle = '#9ca3af';
            ctx.font = '30px Poppins, sans-serif';
            ctx.fillText('aivibebot.com ✨', canvas.width / 2, 1020);

            let link = document.createElement('a');
            link.download = 'vibe-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function shareOnWhatsApp() {
            const text = document.getElementById('outputText').innerText;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + "\n\n- Generated via aivibebot.com 🔥")}`;
            window.open(whatsappUrl, '_blank');
        }

        function shareOnTwitter() {
            const text = document.getElementById('outputText').innerText;
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text + "\n\nChecked my vibe on aivibebot.com 🔥 @aivibebot")}`;
            window.open(twitterUrl, '_blank');
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text);
            const lang = document.getElementById('langSelect').value;
            alert(lang === 'english' ? "Copied to clipboard! 👍" : "टेक्स्ट कॉपी हो गया! 👍");
        }
    </script>
</body>
</html>
